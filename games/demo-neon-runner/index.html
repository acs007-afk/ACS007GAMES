<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Runner // ACS007</title><style>*{box-sizing:border-box}body{margin:0;background:#030806;color:#dfffea;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{width:min(94vw,760px);text-align:center}.hud{display:flex;justify-content:space-between;color:#39ff88;font-size:12px;letter-spacing:2px;margin:0 0 10px}canvas{width:100%;border:1px solid #39ff88;background:#07130d;display:block;box-shadow:0 0 25px #39ff8820}.hint{font-size:11px;color:#8eaa99;letter-spacing:1px;margin-top:12px}button{background:#39ff88;border:0;padding:10px 20px;font-weight:bold;cursor:pointer;margin-top:10px}</style></head><body><div class="wrap"><div class="hud"><span>ACS007 // NEON RUNNER</span><span>SCORE: <b id="score">0</b></span></div><canvas id="game" width="720" height="400" aria-label="Jogo Neon Runner"></canvas><div class="hint">MOVER: ← → OU A / D · DESVIAR DOS BLOCOS · ESPAÇO PARA REINICIAR</div><button id="start">INICIAR / REINICIAR</button></div><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score');let player={x:345,y:335,w:30,h:35},obstacles=[],score=0,over=true,keys={},last=0,spawn=0,speed=3;
function reset(){player.x=345;obstacles=[];score=0;speed=3;spawn=0;over=false;last=0;scoreEl.textContent='0';requestAnimationFrame(loop)}
function loop(t){if(over)return;let dt=Math.min((t-last)/16||1,2);last=t;ctx.clearRect(0,0,720,400);ctx.strokeStyle='#123c26';ctx.lineWidth=1;for(let x=0;x<720;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}for(let y=0;y<400;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(720,y);ctx.stroke()}
if(keys.ArrowLeft||keys.a||keys.A)player.x-=5*dt;if(keys.ArrowRight||keys.d||keys.D)player.x+=5*dt;player.x=Math.max(0,Math.min(720-player.w,player.x));ctx.fillStyle='#39ff88';ctx.shadowColor='#39ff88';ctx.shadowBlur=18;ctx.fillRect(player.x,player.y,player.w,player.h);ctx.shadowBlur=0;
spawn+=dt;if(spawn>42){obstacles.push({x:Math.random()*680,y:-25,w:20+Math.random()*35,h:18+Math.random()*18});spawn=0}for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.y+=(speed+score/450)*dt;ctx.fillStyle='#ff4d6d';ctx.shadowColor='#ff4d6d';ctx.shadowBlur=12;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.shadowBlur=0;if(o.x<player.x+player.w&&o.x+o.w>player.x&&o.y<player.y+player.h&&o.y+o.h>player.y){over=true;ctx.fillStyle='#000b';ctx.fillRect(0,0,720,400);ctx.fillStyle='#ff5573';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('SYSTEM FAILURE',360,185);ctx.fillStyle='#dfffea';ctx.font='16px Arial';ctx.fillText('SCORE: '+Math.floor(score)+' — PRESSIONE ESPAÇO',360,220);return}if(o.y>420){obstacles.splice(i,1);score+=10;scoreEl.textContent=score;}}
requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '&&over)reset()});document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelector('#start').onclick=reset;ctx.fillStyle='#39ff88';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillText('NEON RUNNER',360,180);ctx.font='14px Arial';ctx.fillText('APERTE INICIAR PARA JOGAR',360,215);
</script></body></html>
